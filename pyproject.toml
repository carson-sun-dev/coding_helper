[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coding-helper"
version = "0.1.0"
description = "A governed and observable coding-agent CLI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain",
    "langchain-mcp-adapters",
    "langchain-openai",
    "langgraph",
    "langgraph-checkpoint-sqlite",
    "pydantic-settings",
    "pypdf",
    "rich",
    "typer",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
]

[project.scripts]
coding-helper = "coding_helper.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
